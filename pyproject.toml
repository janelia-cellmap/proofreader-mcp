[project]
name = "proofreader-mcp"
version = "0.1.0"
description = "An MCP server that organizes per-object mesh screenshots and helps a host LLM rank likely-erroneous segmentations for human proofreading"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.13"

authors = [
  { name = "David Ackerman", email = "ackermand@janelia.hhmi.org" },
]

maintainers = [
  { name = "David Ackerman", email = "ackermand@janelia.hhmi.org" },
]

dependencies = [
  "mcp>=1.2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "coverage", "build", "ruff"]
# Heavy 3D-rendering deps for the prototype mesh->PNG tool in tools/. Kept out of
# the core install; intended to migrate to cellmap-analyze once proven.
render = ["pyvista", "numpy", "tqdm"]
# Reading Neuroglancer precomputed meshes (sharded/unsharded, multi-LOD Draco),
# local or remote (gs://, https). Used by the renderer when --source precomputed.
precomputed = ["cloud-volume"]

[project.scripts]
proofreader-mcp = "proofreader_mcp.server:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
